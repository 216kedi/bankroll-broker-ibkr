<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL Veritabanı Sorgulama Arayüzü</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1>🗄️ MySQL Veritabanı Sorgulama Arayüzü</h1>
            <div class="status-indicator">
                <span id="dbStatus" class="status-dot"></span>
                <span id="dbStatusText">Bağlantı Kontrol Ediliyor...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sol Panel - Tablo Listesi -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Tablolar</h2>
                <span id="tableCount" class="badge">0</span>
            </div>
            <div class="search-box">
                <input
                    type="text"
                    id="tableSearch"
                    placeholder="🔍 Tablo ara..."
                    class="search-input"
                >
            </div>
            <div id="tableList" class="table-list">
                <div class="loading-spinner">Yükleniyor...</div>
            </div>
        </aside>

        <!-- Sağ Panel - Tablo Verileri -->
        <main class="content">
            <!-- Boş Durum -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📊</div>
                <h3>Tablo Seçin</h3>
                <p>Verilerini görüntülemek için sol panelden bir tablo seçin.</p>
            </div>

            <!-- Tablo Verileri -->
            <div id="tableContent" class="table-content" style="display: none;">
                <!-- Üst Kontroller -->
                <div class="table-controls">
                    <div class="controls-left">
                        <h2 id="currentTableName" class="table-title"></h2>
                        <span id="recordCount" class="badge">0 kayıt</span>
                    </div>
                    <div class="controls-right">
                        <div class="search-box inline">
                            <input
                                type="text"
                                id="dataSearch"
                                placeholder="🔍 Verilerde ara..."
                                class="search-input"
                            >
                            <button id="clearSearch" class="btn-icon" style="display: none;">✕</button>
                        </div>
                        <button id="exportBtn" class="btn btn-primary">
                            📥 CSV İndir
                        </button>
                    </div>
                </div>

                <!-- Tablo Wrapper -->
                <div class="table-wrapper">
                    <div id="tableLoading" class="loading-overlay" style="display: none;">
                        <div class="loading-spinner">Yükleniyor...</div>
                    </div>
                    <table id="dataTable" class="data-table">
                        <thead id="tableHead">
                            <!-- Sütun başlıkları dinamik olarak eklenecek -->
                        </thead>
                        <tbody id="tableBody">
                            <!-- Veriler dinamik olarak eklenecek -->
                        </tbody>
                    </table>
                </div>

                <!-- Sayfalama Kontrolleri -->
                <div class="pagination-controls">
                    <div class="pagination-info">
                        <span id="paginationText">Sayfa 1 / 1</span>
                        <span class="separator">|</span>
                        <span id="rangeText">1-100 / 0 kayıt</span>
                    </div>
                    <div class="pagination-buttons">
                        <button id="firstPage" class="btn-icon" disabled>⏮️</button>
                        <button id="prevPage" class="btn-icon" disabled>◀️</button>
                        <div class="page-input-group">
                            <input
                                type="number"
                                id="pageInput"
                                min="1"
                                value="1"
                                class="page-input"
                            >
                            <span id="totalPagesText">/ 1</span>
                        </div>
                        <button id="nextPage" class="btn-icon" disabled>▶️</button>
                        <button id="lastPage" class="btn-icon" disabled>⏭️</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Bildirimleri -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
